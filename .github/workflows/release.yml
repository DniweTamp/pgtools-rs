name: Build & Release Portable Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x86_64 MSVC Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/pgtools-gui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Tauri frontend (crates/pgtools-gui/dist)
        working-directory: crates/pgtools-gui
        run: |
          npm ci
          npm run build

      - name: Build self-contained GUI executable (PGTools-Studio.exe)
        run: cargo build --release -p pgtools-gui --features tauri/custom-protocol

      - name: Build standalone CLI executable (pgtools.exe)
        run: cargo build --release -p pgtools-cli

      - name: Stage Windows release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/pgtools-gui.exe release/PGTools-Studio.exe -Force
          Copy-Item target/release/pgtools.exe release/pgtools.exe -Force
          if (Test-Path README.md) {
            Copy-Item README.md release/README.md -Force
          }
          Compress-Archive -Path release/* -DestinationPath PGTools-Studio-Release.zip -Force
          Get-ChildItem release, PGTools-Studio-Release.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: PGTools-Studio-Release.zip

  build-linux:
    name: Linux (x86_64 GUI & CLI AppImages)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri v2 & AppImage system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/pgtools-gui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: crates/pgtools-gui
        run: npm ci

      - name: Build GUI AppImage (PGTools-Studio)
        working-directory: crates/pgtools-gui
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npx tauri build --bundles appimage
          mkdir -p ../../dist-linux
          GUI_APPIMAGE="$(find ../../target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          test -n "$GUI_APPIMAGE"
          cp "$GUI_APPIMAGE" ../../dist-linux/PGTools-Studio-x86_64.AppImage
          chmod +x ../../dist-linux/PGTools-Studio-x86_64.AppImage

      - name: Build CLI AppImage (pgtools)
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          cargo build --release -p pgtools-cli
          mkdir -p pgtools.AppDir/usr/bin dist-linux
          cp target/release/pgtools pgtools.AppDir/usr/bin/pgtools
          strip pgtools.AppDir/usr/bin/pgtools
          cp crates/pgtools-gui/src-tauri/icons/128x128.png pgtools.AppDir/pgtools.png

          cat <<'EOF' > pgtools.AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/pgtools" "$@"
          EOF
          chmod +x pgtools.AppDir/AppRun

          cat <<'EOF' > pgtools.AppDir/pgtools.desktop
          [Desktop Entry]
          Type=Application
          Name=pgtools
          Comment=PlatinumGames Asset & Format CLI Toolkit
          Exec=pgtools
          Icon=pgtools
          Terminal=true
          Categories=Development;Utility;
          EOF

          curl -sSfL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage pgtools.AppDir dist-linux/pgtools-x86_64.AppImage
          chmod +x dist-linux/pgtools-x86_64.AppImage
          ls -lh dist-linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimages
          path: |
            dist-linux/PGTools-Studio-x86_64.AppImage
            dist-linux/pgtools-x86_64.AppImage

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/PGTools-Studio-Release.zip
            release-assets/PGTools-Studio-x86_64.AppImage
            release-assets/pgtools-x86_64.AppImage
