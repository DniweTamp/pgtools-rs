[workspace]
resolver = "2"
members = [
    "crates/pgtools-core",
    "crates/pgtools-cli",
    "crates/pgtools-gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DniweTamp"]
license = "BSD-2-Clause"
description = "High-performance Rust & Tauri v2 toolkit for PlatinumGames file formats (Bayonetta 1/2/3, Vanquish, MGR:R, TW101, NieR: Automata, Astral Chain)"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
crc32fast = "1.4"
half = { version = "2.4", features = ["serde"] }
zstd = "0.13"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
rfd = "0.15"
pgtools-core = { path = "crates/pgtools-core" }
